<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#d6f36a"/><g fill="#121214" font-family="Arial,sans-serif"><text x="80" y="120" font-size="30" font-weight="bold">CHEATSHEET · ACOMPAÑAR</text><text x="80" y="235" font-size="65" font-weight="bold">Qué decir a un pana</text><text x="90" y="370" font-size="38">“Te creo.”</text><text x="90" y="440" font-size="38">“No tienes que resolverlo a solas.”</text><text x="90" y="510" font-size="38">“¿Qué necesitas ahora?”</text><text x="90" y="650" font-size="28" font-weight="bold">Escucha · acompaña · conecta con ayuda</text></g></svg>